name: bindings/csharp

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run at 8:00 AM every day
    - cron: "0 8 * * *"

env:
  VersionSuffix: ${{ github.event_name == 'workflow_dispatch' && 'manualtrigger' || null }}

jobs:  
  build-ffi:
    name: 'Build Regorus FFI: (${{ matrix.runtime.target }})'
    runs-on: ${{ matrix.runtime.os }}
    strategy:
      # let us get failures from other jobs even if one fails
      fail-fast: false
      matrix:
        runtime:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            libpath: |
              **/release/regorus_ffi.dll
              **/release/regorus_ffi.pdb
              **/release/regorus_experimental_ffi.dll
              **/release/regorus_experimental_ffi.pdb
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            libpath: |
              **/release/libregorus_ffi.so
              **/release/libregorus_experimental_ffi.so
          - os: macos-latest
            target: aarch64-apple-darwin
            libpath: |
              **/release/libregorus_ffi.dylib
              **/release/libregorus_experimental_ffi.dylib
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchains/rust
        with:
          targets: ${{ matrix.runtime.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-regorus
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Fetch FFI crate dependencies
        run: cargo fetch --locked --manifest-path bindings/ffi/Cargo.toml --target ${{ matrix.runtime.target }}

      - name: Build Regorus FFI via xtask
        run: cargo xtask build-ffi --release --target ${{ matrix.runtime.target }}

      - name: Build experimental Regorus FFI via xtask
        run: cargo xtask build-ffi --release --experimental --target ${{ matrix.runtime.target }}

      - name: Verify standard and experimental Linux exports
        if: matrix.runtime.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          if nm -D bindings/ffi/target/${{ matrix.runtime.target }}/release/libregorus_ffi.so | grep -q regorus_rvm_take_causality_report; then
            echo "Standard FFI unexpectedly exports explanation APIs."
            exit 1
          fi
          if nm -D bindings/ffi/target/${{ matrix.runtime.target }}/release/libregorus_ffi.so | grep -q regorus_rvm_take_partial_eval_result; then
            echo "Standard FFI unexpectedly exports partial-evaluation APIs."
            exit 1
          fi
          experimental_library=bindings/ffi/target-experimental/${{ matrix.runtime.target }}/release/libregorus_experimental_ffi.so
          nm -D "$experimental_library" | grep -q regorus_rvm_take_causality_report
          nm -D "$experimental_library" | grep -q regorus_rvm_take_partial_eval_result
        
      - name: Upload regorus ffi shared library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regorus-ffi-artifacts-${{ matrix.runtime.target }}
          # Note: The full path of each artifact relative to . is preserved.
          path: ${{ matrix.runtime.libpath }}
          if-no-files-found: error
          retention-days: 1

  build-csharp:
    name: 'Build Regorus nuget'
    runs-on: ubuntu-latest
    needs: build-ffi
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  
      - uses: ./.github/actions/toolchains/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./bindings/csharp/global.json

      - run: echo '${{ steps.stepid.outputs.dotnet-version }}'

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-regorus

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Download regorus ffi shared libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: regorus-ffi-artifacts-*
          merge-multiple: true
          path: ./bindings/csharp/Regorus/tmp

      - name: Display regorus ffi artifacts
        run: ls -R ./bindings/csharp/Regorus/tmp

      - name: Build Regorus nuget via xtask
        run: cargo xtask build-csharp --release --clean --artifacts-dir ./bindings/csharp/Regorus/tmp/bindings/ffi/target --enforce-artifacts --repository-commit ${{ github.sha }} --include-symbols

      - name: Build experimental Regorus nuget via xtask
        run: cargo xtask build-csharp --release --clean --experimental --artifacts-dir ./bindings/csharp/Regorus/tmp/bindings/ffi/target-experimental --enforce-artifacts --repository-commit ${{ github.sha }} --include-symbols

      - name: Upload Regorus nuget
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regorus-nuget
          path: |
            bindings/csharp/Regorus/bin/Release/Microsoft.Regorus*.nupkg
            bindings/csharp/Regorus/bin/Release/Microsoft.Regorus*.snupkg
          if-no-files-found: error
          retention-days: 1

      - name: Upload experimental Regorus nuget
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regorus-experimental-nuget
          path: |
            bindings/csharp/Regorus.Experimental/bin/Release/Microsoft.Regorus.Experimental*.nupkg
            bindings/csharp/Regorus.Experimental/bin/Release/Microsoft.Regorus.Experimental*.snupkg
          if-no-files-found: error
          retention-days: 1

  test-project-reference-hooks:
    name: 'Test C# project reference with native test hooks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchains/rust

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./bindings/csharp/global.json

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build production FFI
        run: cargo build --locked --release --manifest-path bindings/ffi/Cargo.toml

      - name: Run C# panic-guard tests against test-enabled FFI
        run: dotnet test bindings/csharp/Regorus.Tests/Regorus.Tests.csproj --configuration Release -p:EnableRegorusTestHooks=true

      - name: Verify native and generated-header test-hook boundaries
        shell: bash
        run: |
          production_library=bindings/ffi/target/release/libregorus_ffi.so
          test_library=bindings/ffi/target/test-hooks/x86_64-unknown-linux-gnu/release/libregorus_ffi.so
          if nm -D "$production_library" | grep -q regorus_engine_test_; then
            echo "Production FFI unexpectedly exports test hooks."
            exit 1
          fi
          nm -D "$test_library" | grep -q regorus_engine_test_trigger_panic
          nm -D "$test_library" | grep -q regorus_engine_test_reset_poison
          if printf '#include "regorus.h"\n' | cc -E -P -x c -I bindings/ffi - | grep -q regorus_engine_test_; then
            echo "Production header unexpectedly exposes test hooks."
            exit 1
          fi
          printf '#include "regorus.h"\n' | cc -E -P -x c -DREGORUS_FFI_TEST_HOOKS -I bindings/ffi - | grep -q regorus_engine_test_trigger_panic
          printf '#include "regorus.h"\n' | cc -E -P -x c -DREGORUS_FFI_TEST_HOOKS -I bindings/ffi - | grep -q regorus_engine_test_reset_poison

  test-nuget:
    name: 'Test Regorus Nuget: (${{ matrix.runtime.target }})'
    needs: build-csharp
    runs-on: ${{ matrix.runtime.os }}
    strategy:
      # let us get failures from other jobs even if one fails
      fail-fast: false
      matrix:
        runtime:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchains/rust

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./bindings/csharp/global.json

      - run: echo '${{ steps.stepid.outputs.dotnet-version }}'

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-regorus

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Download regorus nuget
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regorus-nuget
          path: ./bindings/csharp/Regorus/bin/Release

      - name: Download experimental regorus nuget
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regorus-experimental-nuget
          path: ./bindings/csharp/Regorus/bin/Release

      - name: Display regorus nuget
        run: ls -R ./bindings/csharp/Regorus/bin/Release

      - name: Run C# tests via xtask
        run: cargo xtask test-csharp --release --clean --nuget-dir bindings/csharp/Regorus/bin/Release

      - name: Run experimental C# tests from package
        run: cargo xtask test-csharp --release --clean --experimental --nuget-dir bindings/csharp/Regorus/bin/Release --skip-apps

      - name: Run standard and experimental package coexistence smoke test
        shell: bash
        run: |
          rm -rf bindings/csharp/local-packages
          mkdir -p bindings/csharp/local-packages
          cp bindings/csharp/Regorus/bin/Release/*.nupkg bindings/csharp/local-packages/
          dotnet restore bindings/csharp/ExperimentalCoexistenceApp/ExperimentalCoexistenceApp.csproj \
            --configfile bindings/csharp/nuget.config \
            -p:UsePackageReference=true \
            -p:RestorePackagesPath=bindings/csharp/.nuget/packages
          dotnet run --project bindings/csharp/ExperimentalCoexistenceApp/ExperimentalCoexistenceApp.csproj \
            --no-restore \
            --configuration Release \
            -p:UsePackageReference=true \
            -p:RestorePackagesPath=bindings/csharp/.nuget/packages

      
