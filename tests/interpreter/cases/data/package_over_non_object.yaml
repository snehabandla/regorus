cases:
  - note: package without rules below a string in base data
    data:
      a: str
    modules:
      - |
        package a.b
      - |
        package q

        p := data.a
        r := data.a.b
    query: data.q
    want_result:
      p: str
      r: {}

  - note: package without rules two levels below a string in base data
    data:
      a:
        b: str
    modules:
      - |
        package a.b.c
      - |
        package q

        p := data.a
        r := data.a.b
        c := data.a.b.c
    query: data.q
    want_result:
      p:
        b: str
      r: str
      c: {}

  - note: package without rules below an array in base data, read from query
    data:
      a: [1]
    modules:
      - |
        package a.b
    query: data.a
    want_result: [1]

  - note: package without rules at a string in base data
    data:
      a:
        b: str
    modules:
      - |
        package a.b
    query: data.a
    want_result:
      b: str

  - note: package without rules below an object in base data
    data:
      a:
        x: 1
    modules:
      - |
        package a.b.c
    query: data.a
    want_result:
      b:
        c: {}
      x: 1

  - note: package without rules below missing base data
    data: {}
    modules:
      - |
        package a.b.c
    query: data.a
    want_result:
      b:
        c: {}

  - note: package with rules below an object in base data
    data:
      a:
        x: 1
    modules:
      - |
        package a.b

        x := 1
    query: data.a
    want_result:
      b:
        x: 1
      x: 1

  - note: package with rules below a string in base data
    data:
      a: str
    modules:
      - |
        package a.b

        x := 1
    query: data.a
    error: not an object

  - note: package with only functions below a string in base data
    data:
      a: str
    modules:
      - |
        package a.b

        f(v) := v
    query: data.a
    error: not an object

  - note: package with rules at a string in base data
    data:
      a:
        b: str
    modules:
      - |
        package a.b

        x := 1
    query: data.a
    error: not an object
